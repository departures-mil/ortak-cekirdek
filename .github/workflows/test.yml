name: Testler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  delta:
    name: Delta yama (Node, Python, Java, Dart, Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: Dart sürümü
        run: dart --version
      - name: Go FCD1 uygulayıcısı (delta/go)
        working-directory: delta/go
        run: go vet ./... && go test -count=1 ./...
      - name: Çapraz dil testleri
        run: bash delta/test/run.sh
      - name: Yayın akışı testi
        run: bash ci/test/run.sh

  web:
    name: Ortak arayüz (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Üretilen dosyalar güncel mi (tokens, core-scoped.css)
        working-directory: web
        run: node tools/build-tokens.js --check && node tools/scope-css.js --check
      - name: Arayüz testleri
        working-directory: web
        run: npm test

  qt:
    name: Ortak arayüz (Python/PySide6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılıklar
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
          pip install PySide6 pytest
      - name: Web ile eşlik denetimi
        working-directory: qt
        run: node tools/gen_from_web.js --check
      - name: Testler
        working-directory: qt
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
