<!DOCTYPE html>
<html lang="tr" dir="ltr" data-scheme="falcon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Ortak Çekirdek — Demo</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/core.css">
<script>
  /* Demo ayarları adres çubuğundan: ?lang=ar&theme=light&scheme=zumrut&host=browser&float=1 */
  (function () {
    var q = new URLSearchParams(location.search), set = function (k, v) { try { localStorage.setItem('fc.' + k, JSON.stringify(v)); } catch (e) {} };
    if (q.get('lang')) set('lang', q.get('lang'));
    if (q.get('theme')) set('theme', q.get('theme'));
    if (q.get('scheme')) set('scheme', q.get('scheme'));
    if (q.get('fresh')) { try { localStorage.clear(); } catch (e) {} }
    if (q.get('shot')) set('onboarding.done', true);
    if (q.get('host') !== 'browser') {
      /* Masaüstü kabuğu taklidi: pencere düğmeleri görünsün, güncelleme "kurulsun" */
      var st = { fullscreen: true, half: false }, cbs = [];
      var emit = function () { cbs.forEach(function (f) { f(st); }); };
      window.fcHost = { kind: 'electron', platform: 'win32', version: '1.56.0',
        window: { minimize: function () { return Promise.resolve(); }, half: function () { st.half = !st.half; st.fullscreen = !st.half; emit(); return Promise.resolve(); },
          toggleFullscreen: function () { st.fullscreen = !st.fullscreen; st.half = false; emit(); return Promise.resolve(); }, close: function () { FC.ui.toast('Kapat → kabuk pencereyi kapatır'); return Promise.resolve(); },
          getState: function () { return Promise.resolve(st); }, onState: function (f) { cbs.push(f); return function () {}; } },
        update: { channel: 'win-app', applyPatch: function () { return new Promise(function (r) { setTimeout(r, 900); }); }, installFull: function () { return new Promise(function (r) { setTimeout(r, 900); }); } } };
    }
  })();
</script>
<script src="../js/storage.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/host.js"></script>
<script src="../js/look.js"></script>
<script src="../js/progress.js"></script>
<script src="../js/updater.js"></script>
<script src="../js/contact.js"></script>
<script src="../js/crash.js"></script>
<script src="../js/usage.js"></script>
<script src="../js/onboarding.js"></script>
<script src="../js/whatsnew.js"></script>
<script src="../js/announcements.js"></script>
<script src="../js/lan-sync-merge.js"></script>
<script src="../js/settings.js"></script>
<script src="../js/topbar.js"></script>
<script src="../js/init.js"></script>
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" id="logo"></div>
      <div><div class="brand-name">Demo</div><div class="brand-tag" data-t="tag"></div></div>
      <span class="version-badge">v1.56</span>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar" id="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button"></button>
      <div class="topbar-title"><h1 class="page-title" id="pageTitle"></h1><p class="page-sub" id="pageSub"></p></div>
    </header>
    <main class="content" id="content"></main>
  </div>
  <div class="drawer-backdrop" id="drawerBack"></div>
</div>
<script>
(function () {
  var ui = FC.ui, t = FC.t, q = new URLSearchParams(location.search);
  FC.i18n.add({
    tr: { tag: 'Ortak çekirdek gösterimi', 'nav.main': 'Genel', 'nav.home': 'Ana sayfa', 'nav.items': 'Kayıtlar', 'nav.sys': 'Sistem', 'nav.settings': 'Ayarlar', 'sub.settings': 'Görünüm, kullanım, iletişim ve program bilgileri', 'sub.home': 'Örnek sayfa', 'sub.items': 'Örnek sayfa',
      'demo.title': 'Demo kontrolleri', 'demo.desc': 'Çekirdek bileşenlerini gerçek sunucuya gitmeden deneyin.', 'demo.sync': 'Eşitleme durumu', 'demo.update': 'Güncelleme benzetimi', 'demo.wn': 'Neler yeni', 'demo.ann': 'Duyuru', 'demo.count': 'Sayaç +500 okuma', 'demo.klasik': 'Örnek "klasik" şemayı kaydet' },
    en: { tag: 'Common core showcase', 'nav.main': 'General', 'nav.home': 'Home', 'nav.items': 'Records', 'nav.sys': 'System', 'nav.settings': 'Settings', 'sub.settings': 'Appearance, usage, contact and program info', 'sub.home': 'Sample page', 'sub.items': 'Sample page',
      'demo.title': 'Demo controls', 'demo.desc': 'Try the core components without contacting any server.', 'demo.sync': 'Sync state', 'demo.update': 'Simulate update', 'demo.wn': 'What\'s new', 'demo.ann': 'Announcement', 'demo.count': 'Counter +500 reads', 'demo.klasik': 'Register sample "classic" scheme' },
    ar: { tag: 'عرض النواة المشتركة', 'nav.main': 'عام', 'nav.home': 'الرئيسية', 'nav.items': 'السجلات', 'nav.sys': 'النظام', 'nav.settings': 'الإعدادات', 'sub.settings': 'المظهر والاستخدام والتواصل ومعلومات البرنامج', 'sub.home': 'صفحة تجريبية', 'sub.items': 'صفحة تجريبية',
      'demo.title': 'أدوات العرض التجريبي', 'demo.desc': 'جرّب مكونات النواة دون الاتصال بأي خادم.', 'demo.sync': 'حالة المزامنة', 'demo.update': 'محاكاة التحديث', 'demo.wn': 'ما الجديد', 'demo.ann': 'إعلان', 'demo.count': 'العداد +500 قراءة', 'demo.klasik': 'تسجيل نظام «كلاسيكي» تجريبي' }
  });

  /* Sahte sunucu: manifest + dosyalar (demo internete çıkmaz) */
  var FULL = new Uint8Array(6 * 1048576), PATCH = new Uint8Array(1.4 * 1048576 | 0);
  function slowBody(bytes) { var i = 0, CH = 96 * 1024; return { getReader: function () { return { read: function () { return new Promise(function (r) { setTimeout(function () { if (i >= bytes.length) return r({ done: true }); var v = bytes.subarray(i, i + CH); i += CH; r({ done: false, value: v }); }, q.get('float') ? 260 : 40); }); } }; } }; }
  var manifest = null;
  async function prepare() {
    var h = function (b) { return FC.updater.sha256(b); };
    manifest = { schema: 1, app: 'demo', version: '1.57.0', published: '2026-11-24T10:00:00Z', minVersion: '1.0.0',
      notes: { tr: '- Yeni renk şemaları ve yüksek kontrast\n- Güncelleme artık yalnızca değişen kısımları indiriyor\n- Arapça yazı düzeltmeleri', en: '- New colour schemes and high contrast\n- Updates now download only the changed parts\n- Arabic text fixes', ar: '- أنظمة ألوان جديدة ووضع التباين العالي\n- يُنزّل التحديث الآن الأجزاء المتغيرة فقط\n- إصلاحات في النص العربي' },
      assets: { 'win-app': { file: 'Demo-1.57.0-app.asar', size: FULL.length, sha256: await h(FULL), patches: { '1.56.0': { file: 'Demo-app.patch-from-1.56.0.bin', size: PATCH.length, sha256: await h(PATCH) } } } } };
  }
  function fakeFetch(url) {
    var name = decodeURIComponent(String(url).split('?')[0].split('/').pop());
    var map = { 'latest.json': new TextEncoder().encode(JSON.stringify(manifest)), 'Demo-1.57.0-app.asar': FULL, 'Demo-app.patch-from-1.56.0.bin': PATCH };
    var b = map[name];
    if (!b) return Promise.resolve({ ok: false, status: 404, headers: { get: function () { return null; } } });
    return Promise.resolve({ ok: true, status: 200, headers: { get: function (k) { return k === 'content-length' ? String(b.length) : null; } }, json: function () { return Promise.resolve(JSON.parse(new TextDecoder().decode(b))); }, body: slowBody(b) });
  }

  FC.init({ app: 'demo', version: '1.56.0', update: false, whatsnew: false, crash: true });
  FC.updater.start({ repo: 'demo', app: 'demo', version: '1.56.0', autoCheck: false, fetch: fakeFetch });

  /* kabuk */
  document.getElementById('logo').innerHTML = ui.icon('zap');
  document.getElementById('menuBtn').innerHTML = ui.icon('menu');
  document.getElementById('menuBtn').onclick = function () { document.getElementById('shell').classList.add('drawer-open'); };
  document.getElementById('drawerBack').onclick = function () { document.getElementById('shell').classList.remove('drawer-open'); };
  var page = 'settings';
  var NAV = [['nav.main', [['home', 'home'], ['items', 'box']]], ['nav.sys', [['settings', 'settings']]]];
  function drawNav() {
    var n = document.getElementById('nav'); n.innerHTML = '';
    NAV.forEach(function (g) {
      var grp = ui.el('div.nav-group', null, [ui.el('div.nav-group-title', { text: t(g[0]) })]);
      g[1].forEach(function (it) { grp.appendChild(ui.el('button.nav-item' + (page === it[0] ? '.active' : ''), { type: 'button', html: ui.icon(it[1]) + '<span>' + ui.esc(t('nav.' + it[0])) + '</span>', onclick: function () { page = it[0]; drawNav(); drawPage(); } })); });
      n.appendChild(grp);
    });
    document.querySelectorAll('[data-t]').forEach(function (e) { e.textContent = t(e.dataset.t); });
    document.getElementById('pageTitle').textContent = t('nav.' + page);
    document.getElementById('pageSub').textContent = t('sub.' + page);
  }
  var tb = FC.topbar.mount(document.getElementById('topbar'), {
    before: [FC.announcements.button()],
    sync: { onClick: function () { tb.setSync('syncing'); setTimeout(function () { tb.setSync('idle'); }, 1500); } },
    lan: { onClick: function (s) { tb.setLan(s === 'on' ? 'off' : 'on'); } }
  });
  tb.setSync('idle', 3); tb.setLan('on');

  function demoCard() {
    var c = ui.card({ key: 'demo', title: t('demo.title'), icon: 'zap', desc: t('demo.desc') });
    c.appendChild(ui.el('div.field-label', { text: t('demo.sync'), style: 'margin-top:12px' }));
    var seg = ui.el('div.fc-row', { style: 'margin-top:6px' });
    ['idle', 'syncing', 'error', 'off', 'offline'].forEach(function (s) { seg.appendChild(ui.el('button.btn.small', { type: 'button', text: s, onclick: function () { tb.setSync(s, s === 'idle' ? 0 : 3); } })); });
    c.appendChild(seg);
    c.appendChild(ui.el('div.fc-row', null, [
      ui.el('button.btn.small.primary', { type: 'button', html: ui.icon('download') + ui.esc(t('demo.update')), onclick: function () { FC.updater.check().then(function () { return FC.updater.run(); }).then(function () { setTimeout(function () { FC.storage.set('whatsnew.seen', '1.56.0'); FC.whatsnew.start({ version: '1.57.0', delayMs: 0 }); }, 800); }); } }),
      ui.el('button.btn.small', { type: 'button', html: ui.icon('sparkles') + ui.esc(t('demo.wn')), onclick: function () { FC.storage.set('whatsnew.pending', { version: '1.57.0', notes: manifest.notes }); FC.whatsnew.show('1.57.0'); } }),
      ui.el('button.btn.small', { type: 'button', html: ui.icon('bell') + ui.esc(t('demo.ann')), onclick: function () { FC.announcements._ingest([{ id: 'demo-' + Date.now(), tarih: new Date().toISOString(), onem: 'onemli', baslik: { tr: 'Örnek duyuru', en: 'Sample announcement', ar: 'إعلان تجريبي' }, metin: { tr: 'Yeni sürüm yayınlandı. Güncellemek için sağ üstteki düğmeye basın.', en: 'A new version is out. Press the button at the top right to update.', ar: 'صدر إصدار جديد. اضغط الزر في أعلى الشاشة للتحديث.' }, guncellemeDugmesi: true }]); } }),
      ui.el('button.btn.small', { type: 'button', html: ui.icon('gauge') + ui.esc(t('demo.count')), onclick: function () { FC.usage.count('firebase.read', 500); FC.usage.count('firebase.write', 120); FC.usage.count('ai.gemini', 3); } }),
      ui.el('button.btn.small', { type: 'button', html: ui.icon('type') + ui.esc(t('demo.klasik')), onclick: function () { registerKlasik(); drawPage(); } })
    ]));
    return c;
  }
  function registerKlasik() {
    FC.look.registerScheme('klasik', { label: { tr: 'Klasik (eski görünüm)', en: 'Classic (previous look)', ar: 'الكلاسيكي (المظهر السابق)' },
      dark: { '--bg': '#1d2433', '--panel': '#263042', '--panel-solid': '#263042', '--panel-hover': '#2e3a50', '--text': '#f3f4f6', '--muted': '#b8c0cc', '--accent': '#60a5fa', '--accent-2': '#2563eb', '--primary-1': '#2563eb', '--primary-2': '#1d4ed8', '--sidebar-bg': '#1a2130', '--topbar-bg': '#1d2433', '--modal-bg': '#263042', '--glow-1': '#0000', '--glow-2': '#0000', '--bg-grid': '#0000' } });
  }
  if (q.get('klasik')) registerKlasik();
  function drawPage() {
    var c = document.getElementById('content'); c.innerHTML = '';
    if (page !== 'settings') { c.appendChild(ui.el('div.card', null, [ui.el('h3.card-title', { html: ui.icon('box') + ui.esc(t('nav.' + page)) }), ui.el('p.card-desc', { text: t('sub.' + page) })])); return; }
    FC.settings.build(c, { cards: [demoCard()], usage: { project: function () { return 'benim-firebase-projem'; } }, about: { version: '1.56.0' }, onboarding: {} });
  }
  FC.usage.count('firebase.read', 12840); FC.usage.count('firebase.write', 1730); FC.usage.count('firebase.delete', 42); FC.usage.count('ai.gemini', 27); FC.usage.count('ai.groq', 4);
  drawNav(); drawPage();
  FC.i18n.onChange(function () { drawNav(); drawPage(); });
  prepare().then(function () {
    if (q.get('ob')) { var m = FC.onboarding.open({}); for (var i = 1; i < +q.get('ob'); i++) m.el.querySelector('.modal-footer .btn.primary').click(); }
    else if (q.get('wn')) { FC.storage.set('whatsnew.pending', { version: '1.57.0', notes: manifest.notes }); FC.whatsnew.show('1.57.0'); }
    else if (q.get('float')) { FC.updater.check().then(function () { FC.updater.run(); }); }
    else if (!q.get('shot')) FC.onboarding.maybeStart({ fetch: function () { return Promise.reject(new Error('demo')); } });
  });
})();
</script>
</body>
</html>
